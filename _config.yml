title: "jmilkiewicz notes"
description: "Notes on distributed workflows, Temporal and building reliable systems”."
author:
  name: "Jakub Milkiewicz"
url: "https://jmilkiewicz.github.io"
baseurl: ""
lang: en
timezone: Europe/Warsaw

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

sass:
  style: compressed

defaults:
  # Social preview (og:image) for every page; a post can override it with its own image:.
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post

permalink: /:year/:month/:title/

exclude:
  - tools
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .serena
  - .claude
